name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Build sandbox image (enables the Docker security tests)
        run: docker build -t codelens-worker:latest worker
      - name: Tests
        run: python -m pytest -q
        # Live REA tests skip automatically: the rea/ toolchain is not installed in CI.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Full browser run: built UI + API (dev sandbox) + headless Chrome.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Start API
        working-directory: backend
        env:
          CODELENS_SANDBOX: subprocess
          CODELENS_RATE_LIMIT_PER_MIN: "0"
        run: |
          pip install -r requirements-dev.txt
          nohup python -m uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Browser tests
        working-directory: frontend
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run e2e
      - name: Upload screenshots and API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/e2e/screenshots
            api.log
